name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Prepare cytoscape-compound-graph dependency
        run: bash packaging/prepare-compound-graph.sh

      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run lint:throws-diff
      - run: npm run test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        run: bash packaging/install-linux-deps.sh

      - name: Prepare bellman sidecar
        env:
          REQUIRE_SIDECAR_DOWNLOAD: "1"
        run: bash packaging/prepare-sidecar.sh

      - run: cargo test
        working-directory: src-tauri

      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

  build:
    runs-on: ${{ matrix.runner }}
    needs: [frontend, rust]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
          - platform: windows
            runner: windows-latest
          - platform: macos
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ci-${{ matrix.platform }}

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: bash packaging/install-linux-deps.sh

      - name: Prepare cytoscape-compound-graph dependency
        shell: bash
        run: bash packaging/prepare-compound-graph.sh

      - run: npm ci
        shell: bash

      - name: Prepare bellman sidecar
        shell: bash
        env:
          REQUIRE_SIDECAR_DOWNLOAD: "1"
        run: bash packaging/prepare-sidecar.sh

      # Compile the release binary without packaging (faster CI).
      # The release-dev workflow builds and publishes signed platform bundles.
      - run: npm run tauri build -- --no-bundle
        shell: bash
