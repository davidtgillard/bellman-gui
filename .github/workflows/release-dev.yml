name: Release dev

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
          - platform: windows
            runner: windows-latest
          - platform: macos
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.platform }}

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: bash packaging/install-linux-deps.sh

      - name: Prepare cytoscape-compound-graph dependency
        shell: bash
        run: bash packaging/prepare-compound-graph.sh

      - run: npm ci
        shell: bash

      - name: Prepare bellman sidecar
        shell: bash
        env:
          REQUIRE_SIDECAR_DOWNLOAD: "1"
        run: bash packaging/prepare-sidecar.sh

      - name: Stamp release version
        shell: bash
        run: bash packaging/stamp-version.sh "0.1.${{ github.run_number }}"

      - name: Build release bundles
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Key was generated without a password. GitHub rejects empty secrets, so
          # do not wire TAURI_SIGNING_PRIVATE_KEY_PASSWORD from secrets.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm run tauri build

      - name: Stage Linux release artifacts
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release
          APPIMAGE_DIR="src-tauri/target/release/bundle/appimage"
          COUNT="$(find "${APPIMAGE_DIR}" -maxdepth 1 -type f -name '*.AppImage' | wc -l | tr -d '[:space:]')"
          if [[ "${COUNT}" -ne 1 ]]; then
            echo "Expected exactly one AppImage in ${APPIMAGE_DIR}, found ${COUNT}" >&2
            ls -la "${APPIMAGE_DIR}" >&2 || true
            exit 1
          fi
          APPIMAGE="$(find "${APPIMAGE_DIR}" -maxdepth 1 -type f -name '*.AppImage' | sort | head -n 1)"
          SIG="${APPIMAGE}.sig"
          if [[ ! -f "${SIG}" ]]; then
            echo "Missing signature: ${SIG}" >&2
            exit 1
          fi
          cp "${APPIMAGE}" dist/release/
          cp "${SIG}" dist/release/
          ls -la dist/release

      - name: Stage Windows release artifacts
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release
          NSIS_DIR="src-tauri/target/release/bundle/nsis"
          COUNT="$(find "${NSIS_DIR}" -maxdepth 1 -type f -name '*-setup.exe' | wc -l | tr -d '[:space:]')"
          if [[ "${COUNT}" -ne 1 ]]; then
            echo "Expected exactly one NSIS setup exe in ${NSIS_DIR}, found ${COUNT}" >&2
            ls -la "${NSIS_DIR}" >&2 || true
            exit 1
          fi
          SETUP="$(find "${NSIS_DIR}" -maxdepth 1 -type f -name '*-setup.exe' | sort | head -n 1)"
          SIG="${SETUP}.sig"
          if [[ ! -f "${SIG}" ]]; then
            echo "Missing signature: ${SIG}" >&2
            exit 1
          fi
          cp "${SETUP}" dist/release/
          cp "${SIG}" dist/release/
          ls -la dist/release

      - name: Stage macOS release artifacts
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release
          MACOS_DIR="src-tauri/target/release/bundle/macos"
          DMG_DIR="src-tauri/target/release/bundle/dmg"
          TARBALL_COUNT="$(find "${MACOS_DIR}" -maxdepth 1 -type f -name '*.app.tar.gz' | wc -l | tr -d '[:space:]')"
          if [[ "${TARBALL_COUNT}" -ne 1 ]]; then
            echo "Expected exactly one .app.tar.gz in ${MACOS_DIR}, found ${TARBALL_COUNT}" >&2
            ls -la "${MACOS_DIR}" >&2 || true
            exit 1
          fi
          TARBALL="$(find "${MACOS_DIR}" -maxdepth 1 -type f -name '*.app.tar.gz' | sort | head -n 1)"
          SIG="${TARBALL}.sig"
          if [[ ! -f "${SIG}" ]]; then
            echo "Missing signature: ${SIG}" >&2
            exit 1
          fi
          DMG_COUNT="$(find "${DMG_DIR}" -maxdepth 1 -type f -name '*.dmg' | wc -l | tr -d '[:space:]')"
          if [[ "${DMG_COUNT}" -ne 1 ]]; then
            echo "Expected exactly one DMG in ${DMG_DIR}, found ${DMG_COUNT}" >&2
            ls -la "${DMG_DIR}" >&2 || true
            exit 1
          fi
          DMG="$(find "${DMG_DIR}" -maxdepth 1 -type f -name '*.dmg' | sort | head -n 1)"
          cp "${TARBALL}" dist/release/
          cp "${SIG}" dist/release/
          cp "${DMG}" dist/release/
          ls -la dist/release

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bellman-gui-${{ matrix.platform }}
          path: dist/release/*

  publish-dev-release:
    name: Publish dev release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: bellman-gui-linux
          path: release

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: bellman-gui-windows
          path: release

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: bellman-gui-macos
          path: release

      - name: Build latest.json
        env:
          VERSION: "0.1.${{ github.run_number }}"
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          APPIMAGES=(release/*.AppImage)
          APPIMAGE_SIGS=(release/*.AppImage.sig)
          SETUPS=(release/*-setup.exe)
          SETUP_SIGS=(release/*-setup.exe.sig)
          TARBALLS=(release/*.app.tar.gz)
          TARBALL_SIGS=(release/*.app.tar.gz.sig)
          if [[ "${#APPIMAGES[@]}" -ne 1 || "${#APPIMAGE_SIGS[@]}" -ne 1 ]]; then
            echo "Expected one AppImage and .sig" >&2
            ls -la release >&2
            exit 1
          fi
          if [[ "${#SETUPS[@]}" -ne 1 || "${#SETUP_SIGS[@]}" -ne 1 ]]; then
            echo "Expected one NSIS setup exe and .sig" >&2
            ls -la release >&2
            exit 1
          fi
          if [[ "${#TARBALLS[@]}" -ne 1 || "${#TARBALL_SIGS[@]}" -ne 1 ]]; then
            echo "Expected one .app.tar.gz and .sig" >&2
            ls -la release >&2
            exit 1
          fi
          bash packaging/write-latest-json.sh \
            --version "${VERSION}" \
            --repo "${REPO}" \
            --out release/latest.json \
            --platform linux-x86_64 "${APPIMAGES[0]}" "${APPIMAGE_SIGS[0]}" \
            --platform windows-x86_64 "${SETUPS[0]}" "${SETUP_SIGS[0]}" \
            --platform darwin-aarch64 "${TARBALLS[0]}" "${TARBALL_SIGS[0]}"
          ls -la release

      - name: Ensure dev release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view dev --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit dev \
              --repo "$GITHUB_REPOSITORY" \
              --title "Development builds" \
              --notes "Rolling development builds for bellman-gui (linux-x86_64 AppImage, windows-x86_64 NSIS, darwin-aarch64 DMG)." \
              --prerelease
          else
            gh release create dev \
              --repo "$GITHUB_REPOSITORY" \
              --title "Development builds" \
              --notes "Rolling development builds for bellman-gui (linux-x86_64 AppImage, windows-x86_64 NSIS, darwin-aarch64 DMG)." \
              --prerelease
          fi

      - name: Remove existing dev assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/dev" --jq '.id')"
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --jq '.[].id' | while read -r asset_id; do
            [ -n "$asset_id" ] || continue
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
          done

      - name: Upload fresh dev bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload dev release/* --repo "$GITHUB_REPOSITORY"
